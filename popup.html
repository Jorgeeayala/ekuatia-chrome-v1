<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CDC consultados</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 12px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #111827;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .acciones {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        background: #2563eb;
                color: #fff;
      }
      button.secundario {
        background: #e5e7eb;
        color: #111827;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 300px;
        overflow: auto;
      }
      li {
        border-top: 1px solid #e5e7eb;
        padding: 6px 0;
      }
      li code {
        font-size: 11px;
        color: #1d4ed8;
        word-break: break-all;
      }
      .meta {
        color: #6b7280;
        font-size: 11px;
      }
      .vacio {
        color: #6b7280;
      }
      .nota {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #e5e7eb;
        color: #6b7280;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>CDC consultados</h1>
    <div class="acciones">
      <button id="copiar">Copiar todos</button>
      <button id="limpiar" class="secundario">Limpiar</button>
    </div>
    <ul id="lista"></ul>
    <p class="nota">
      Cada CDC consultado con esta extensión queda guardado acá. La idea es
      exportarlos (uno por línea) para alimentar el descargador de XML.
    </p>
    <script src="src/cdc.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
